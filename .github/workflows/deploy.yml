name: CD - Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggers

env:
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/app
  DEPLOYMENT_TIMEOUT: 300

jobs:
  # Wait for CI to complete successfully
  wait-for-ci:
    name: Wait for CI to Pass
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.sha }}
          check-name: 'CI'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  build-and-push:
    name: Build and Push Docker Image
    needs: wait-for-ci
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configure AWS credentials
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/app
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/app
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Save deployment metadata
        run: |
          echo "IMAGE_TAG=${{ steps.meta.outputs.tags }}" >> deployment-info.txt
          echo "COMMIT_SHA=${{ github.sha }}" >> deployment-info.txt
          echo "DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> deployment-info.txt

      - name: Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metadata
          path: deployment-info.txt

  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ secrets.APP_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download deployment metadata
        uses: actions/download-artifact@v4
        with:
          name: deployment-metadata

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Get current deployment info (for rollback)
        id: current-deployment
        run: |
          CURRENT_IMAGE=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "docker ps --filter 'name=app' --format '{{.Image}}' | head -n1" || echo "none")
          echo "current-image=$CURRENT_IMAGE" >> $GITHUB_OUTPUT
          echo "Current deployment: $CURRENT_IMAGE"

      - name: Deploy to EC2
        id: deploy
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
          set -e
          
          # Pull new image
          echo "Pulling new Docker image..."
          docker pull ${{ env.DOCKER_IMAGE_NAME }}:latest
          
          # Stop and backup current container
          if docker ps -a --filter "name=app" --format "{{.Names}}" | grep -q "^app$"; then
            echo "Backing up current container..."
            docker rename app app-backup-$(date +%s) || true
            docker stop app-backup-* || true
          fi
          
          # Start new container
          echo "Starting new container..."
          docker run -d \
            --name app \
            --restart unless-stopped \
            -p 80:3000 \
            -e NODE_ENV=production \
            ${{ env.DOCKER_IMAGE_NAME }}:latest
          
          # Wait for container to be healthy
          echo "Waiting for container to start..."
          sleep 10
          
          # Clean up old backup containers (keep last 3)
          docker ps -a --filter "name=app-backup-" --format "{{.Names}}" | tail -n +4 | xargs -r docker rm -f
          
          echo "Deployment completed successfully"
          ENDSSH

      - name: Health check
        id: health-check
        run: |
          MAX_ATTEMPTS=30
          ATTEMPT=0
          
          echo "Running health check..."
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if curl -f -s -o /dev/null -w "%{http_code}" ${{ secrets.APP_URL }}/health | grep -q "200"; then
              echo "Health check passed!"
              exit 0
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS failed, retrying in 10s..."
            sleep 10
          done
          
          echo "Health check failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "Deployment failed, initiating rollback..."
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
          set -e
          
          # Stop failed container
          docker stop app || true
          docker rm app || true
          
          # Restore previous container
          BACKUP_CONTAINER=$(docker ps -a --filter "name=app-backup-" --format "{{.Names}}" | head -n1)
          
          if [ -n "$BACKUP_CONTAINER" ]; then
            echo "Restoring backup container: $BACKUP_CONTAINER"
            docker rename $BACKUP_CONTAINER app
            docker start app
            echo "Rollback completed successfully"
          else
            echo "No backup container found, deploying previous image"
            docker run -d \
              --name app \
              --restart unless-stopped \
              -p 80:3000 \
              -e NODE_ENV=production \
              ${{ steps.current-deployment.outputs.current-image }}
          fi
          ENDSSH
          
          echo "Rollback completed"

      - name: Verify rollback
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          sleep 15
          if curl -f -s ${{ secrets.APP_URL }}/health; then
            echo "Rollback successful, application is healthy"
          else
            echo "WARNING: Rollback completed but health check still failing"
            exit 1
          fi

      - name: Clean up SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

  notify:
    name: Send Notification
    needs: [build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "${{ steps.status.outputs.emoji }} Deployment ${{ steps.status.outputs.status }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.status.outputs.emoji }} Deployment ${{ steps.status.outputs.status }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<${{ github.event.head_commit.url }}|${{ github.sha }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\nProduction"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Commit Message:*\n${{ github.event.head_commit.message }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Send email notification
        if: ${{ secrets.NOTIFICATION_EMAIL != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "${{ steps.status.outputs.emoji }} Deployment ${{ steps.status.outputs.status }} - ${{ github.repository }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions <noreply@github.com>
          body: |
            Deployment Status: ${{ steps.status.outputs.status }}
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            
            Commit Message:
            ${{ github.event.head_commit.message }}
            
            Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Deployed at: ${{ secrets.APP_URL }}

      - name: Create GitHub deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: []
            });
            
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: '${{ steps.status.outputs.status }}',
              environment_url: '${{ secrets.APP_URL }}',
              description: 'Deployment ${{ steps.status.outputs.status }}'
            });
