name: Security Scanning

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: npm-audit
        run: |
          npm audit --json > audit-results.json || true
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' audit-results.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit-results.json)
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Found $CRITICAL critical vulnerabilities"
            npm audit
            exit 1
          elif [ "$HIGH" -gt 0 ]; then
            echo "::warning::Found $HIGH high vulnerabilities"
            npm audit
          fi

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: audit-results.json

      - name: Create issue for critical vulnerabilities
        if: failure() && steps.npm-audit.outputs.critical > 0
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('audit-results.json', 'utf8'));
            
            const critical = audit.metadata.vulnerabilities.critical || 0;
            const high = audit.metadata.vulnerabilities.high || 0;
            
            const body = `## 🚨 Critical Security Vulnerabilities Detected
            
            **Critical:** ${critical}
            **High:** ${high}
            
            ### Details
            \`\`\`
            ${JSON.stringify(audit.vulnerabilities, null, 2).substring(0, 5000)}
            \`\`\`
            
            ### Action Required
            Run \`npm audit fix\` to resolve these vulnerabilities.
            
            **Workflow:** ${context.workflow}
            **Run:** ${context.runId}`;
            
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,npm-audit'
            });
            
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Critical NPM Security Vulnerabilities Detected`,
                body: body,
                labels: ['security', 'npm-audit', 'critical']
              });
            }

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  secret-scanning:
    name: Secret Scanning with Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload Gitleaks report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif

      - name: Create issue for leaked secrets
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🔐 Potential Secrets Detected in Code
            
            Gitleaks has detected potential secrets or sensitive information in the codebase.
            
            ### Action Required
            1. Review the gitleaks report artifact
            2. Rotate any exposed credentials immediately
            3. Remove secrets from code and use environment variables or secrets management
            
            **Workflow:** ${context.workflow}
            **Run:** ${context.runId}
            **Commit:** ${context.sha}`;
            
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,secrets'
            });
            
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔐 Potential Secrets Detected in Code`,
                body: body,
                labels: ['security', 'secrets', 'critical']
              });
            }

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          deny-licenses: GPL-3.0, AGPL-3.0

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, codeql-analysis, secret-scanning]
    if: always()
    steps:
      - name: Check security status
        run: |
          echo "Security scan completed"
          echo "NPM Audit: ${{ needs.npm-audit.result }}"
          echo "CodeQL: ${{ needs.codeql-analysis.result }}"
          echo "Secret Scanning: ${{ needs.secret-scanning.result }}"

      - name: Fail on critical issues
        if: |
          github.event_name == 'pull_request' && 
          (needs.npm-audit.result == 'failure' || needs.secret-scanning.result == 'failure')
        run: |
          echo "::error::Critical security issues found. PR cannot be merged."
          exit 1
